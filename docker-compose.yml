services:
  ai-sertifikat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-sertifikat-web
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "False"
      SQLITE_PATH: /app/data/db.sqlite3
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - sqlite_data:/app/data
      - static_data:/app/backend/staticfiles
    command: >
      sh -c "python -c 'import os; print(\"Starting AI Sertifikat\")' &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"

volumes:
  sqlite_data:
  static_data:
