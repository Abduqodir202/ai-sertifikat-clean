<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parol o'zgartirildi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #dce8f0, #e6f1ec);
    }
    .card {
      width: 100%; max-width: 420px; background: #f8fbfc; text-align: center;
      border-radius: 20px; padding: 40px 32px;
      box-shadow: 0 10px 40px rgba(40, 80, 110, .12);
    }
    .icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%;
      background: #e1f2ec; color: #3a8f7a; font-size: 32px; line-height: 64px; }
    h1 { margin: 0 0 8px; font-size: 26px; color: #2a4a5e; }
    p { margin: 0 0 24px; color: #7a8d99; font-size: 15px; line-height: 1.5; }
    .btn {
      display: block; padding: 14px; font-size: 16px; font-weight: 600; color: #fff;
      text-decoration: none; border-radius: 12px;
      background: linear-gradient(135deg, #4a7fa8, #3a8f7a);
    }
    .btn:hover { opacity: .92; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Parol o'zgartirildi</h1>
    <p>Yangi parolingiz saqlandi. Endi hisobingizga kirishingiz mumkin.</p>
    <a class="btn" href="{% url 'account_login' %}">Kirish</a>
  </div>
</body>
